database:
  url: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
  batch_size: 50

kafka:
  bootstrap_servers: "kafka:29092"
  topic: "transaction-decisions"
  group_id: "fraud-rag-group"

embedding:
  model_name: "all-MiniLM-L6-v2"
  dimension: 384

#llm:
#  provider: "openai"
#  base_url: "https://api.openai.com/v1"
#  api_key: "${OPENAI_API_KEY}"
#  model_name: "gpt-4o"

llm:
  provider: "ollama"
  base_url: "http://ollama:11434/v1"
  api_key: "ollama"
  model_name: "llama3"

dashboard:
  rag_url: "http://rag-api:8000/ask"
  inject_url: "http://fraud-detection-service:8000/transaction/inject?duration_seconds=1"
  transactions_url: "http://rag-api:8000/transactions/timeseries"
  fraud_detection_base_url: "http://fraud-detection-service:8000"


mcp_servers:
  repository:
    url: "http://mcp-repository:8003/sse"

monitoring:
  # Identifies this service in Langfuse traces and the OTel service.name.
  service_name: "ms-fraud-rag"
  # Redact amounts and raw V-features from traces before they leave the process.
  # Turn off only if the Langfuse instance is as trusted as the database itself.
  mask_sensitive_data: true
