services:
  postgres:
    image: ankane/pgvector:latest
    container_name: fraud-db
    networks:
      - fraud-net
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: fraud-rag-zookeeper
    networks:
      - fraud-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: fraud-rag-kafka
    networks:
      - fraud-net
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      # INTERNAL (kafka:29092) is what other containers use; EXTERNAL (localhost:9092)
      # lets host processes / an external producer connect.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    entrypoint: >
      sh -c "
        ollama serve &
        until curl -sf http://localhost:11434/api/tags; do sleep 2; done &&
        ollama pull llama3 &&
        wait
      "

  mcp-repository:
    build: .
    container_name: mcp-repository
    networks:
      - fraud-net
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - HF_HOME=/app/model_cache
      - APP_ENV=prod
    volumes:
      - ./model_cache:/app/model_cache
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m services.mcp_server.repository_server

  mcp-analysis:
    build: .
    container_name: mcp-analysis
    networks:
      - fraud-net
    ports:
      - "8004:8004"
    environment:
      - APP_ENV=prod
    command: python -m services.mcp_server.analysis_server

  rag-api:
    build: .
    container_name: rag-api
    ports:
      - "8002:8000"
    networks:
      - fraud-net
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - HF_HOME=/app/model_cache
      - APP_ENV=prod
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - ./model_cache:/app/model_cache
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mcp-repository:
        condition: service_started
      mcp-analysis:
        condition: service_started
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8002}
        VITE_INJECT_URL: ${VITE_INJECT_URL:-}
    container_name: fraud-web
    ports:
      - "8080:80"
    networks:
      - fraud-net
    depends_on:
      - rag-api

volumes:
  pgdata:
  ollama_data:

networks:
  fraud-net:
    driver: bridge
