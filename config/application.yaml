database:
  url: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}"
  batch_size: 50

kafka:
  bootstrap_servers: "localhost:9092"
  topic: "transaction-decisions"
  group_id: "fraud-rag-group"

embedding:
  model_name: "all-MiniLM-L6-v2"
  dimension: 384

llm:
  provider: "ollama"
  base_url: "http://localhost:1234/v1"
  api_key: "ollama"
  model_name: "google/gemma-4-e4b"

dashboard:
  rag_url: "http://localhost:8001/ask"
  inject_url: "http://localhost:8000/transaction/inject?duration_seconds=1"
  transactions_url: "http://localhost:8001/transactions/timeseries"
  fraud_detection_base_url: "http://localhost:8000"


mcp_servers:
  repository:
    url: "http://localhost:8003/sse"

monitoring:
  # Identifies this service in Langfuse traces and the OTel service.name.
  service_name: "ms-fraud-rag"
  # Redact amounts and raw V-features from traces before they leave the process.
  # Turn off only if the Langfuse instance is as trusted as the database itself.
  mask_sensitive_data: true
